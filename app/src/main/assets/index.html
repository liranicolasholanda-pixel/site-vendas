<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#17131f"><title>Limite do Mercado</title>
<style>
:root{color-scheme:dark;--bg:#100e14;--card:#1b1822;--line:#35303f;--text:#f6f3fa;--muted:#b6afc2;--accent:#a78bfa;--danger:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui;padding:18px 14px 30px}.wrap{max-width:480px;margin:auto}header{padding:10px 2px 18px}h1{font-size:25px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:13px;border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:13px;font:600 15px system-ui;cursor:pointer}.primary{background:var(--accent);color:#171020;width:100%;margin-top:12px}.secondary{background:#302a3b;color:var(--text);width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--bg);border-radius:12px;padding:13px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:22px;margin-top:5px;overflow-wrap:anywhere}.bar{height:10px;background:#393242;border-radius:99px;overflow:hidden;margin:14px 0 8px}.fill{height:100%;width:0;background:var(--accent)}.status{font-size:14px;color:var(--muted)}h2{font-size:17px;margin:0 0 13px}.items{list-style:none;padding:0;margin:0}.items li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.remove{border:0;background:transparent;color:var(--danger);font-size:20px}.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
</style></head><body><main class="wrap">
<header><h1>🛒 Limite do Mercado</h1><p>Some suas compras e acompanhe seu orçamento em tempo real.</p></header>
<section class="card"><label class="label" for="limit">Seu limite de gastos (R$)</label><input id="limit" type="number" min=".01" step=".01" inputmode="decimal" placeholder="Ex.: 150,00"><button id="saveLimit" class="btn primary">Definir limite</button></section>
<section class="card"><div class="stats"><div class="stat"><small>Total gasto</small><strong id="spent">R$ 0,00</strong></div><div class="stat"><small>Saldo restante</small><strong id="remaining">—</strong></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Defina seu limite para começar.</div></section>
<section class="card"><h2>Adicionar produto</h2><label class="label" for="name">Nome do produto (opcional)</label><input id="name" maxlength="70" placeholder="Ex.: arroz"><div style="height:10px"></div><label class="label" for="price">Preço (R$)</label><input id="price" type="number" min=".01" step=".01" inputmode="decimal" placeholder="Ex.: 24,90"><button id="add" class="btn primary">Adicionar ao total</button></section>
<section class="card"><h2>Produtos adicionados</h2><ul class="items" id="items"></ul><p id="empty">Nenhum produto adicionado ainda.</p><button id="reset" class="btn secondary">Zerar compras</button></section><div class="foot">Os dados ficam salvos neste aplicativo.</div></main>
<script>
const $=id=>document.getElementById(id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let state={limit:0,items:[]},a80=false,a100=false;
try{let old=JSON.parse(localStorage.getItem('limiteMercadoV1')||'null');if(old&&Array.isArray(old.items))state=old}catch{}
const total=()=>state.items.reduce((s,i)=>s+i.price,0),save=()=>localStorage.setItem('limiteMercadoV1',JSON.stringify(state));
function notify(m){if(navigator.vibrate)navigator.vibrate([180,80,180]);alert(m)}
function render(){let sum=total(),left=state.limit-sum,p=state.limit?Math.min(100,sum/state.limit*100):0;$('spent').textContent=money(sum);$('remaining').textContent=state.limit?money(left):'—';$('limit').value=state.limit||'';$('fill').style.width=p+'%';$('fill').style.background=left<0?'var(--danger)':p>=80?'#ffd166':'var(--accent)';$('status').textContent=!state.limit?'Defina seu limite para começar.':left<0?'Limite ultrapassado em '+money(-left)+'!':left===0?'Você atingiu exatamente seu limite!':p>=80?'Atenção: você já usou '+Math.floor(p)+'% do limite.':'Você usou '+Math.floor(p)+'% do limite.';$('items').replaceChildren();state.items.forEach((it,i)=>{let li=document.createElement('li'),label=document.createElement('span'),right=document.createElement('span'),del=document.createElement('button');label.textContent=it.name||'Produto';right.textContent=money(it.price)+' ';del.className='remove';del.textContent='×';del.onclick=()=>{state.items.splice(i,1);if(total()<state.limit*.8)a80=false;if(total()<state.limit)a100=false;render()};right.append(del);li.append(label,right);$('items').append(li)});$('empty').style.display=state.items.length?'none':'block';save()}
$('saveLimit').onclick=()=>{let n=Number($('limit').value);if(!Number.isFinite(n)||n<=0)return alert('Digite um limite maior que zero.');state.limit=Math.round(n*100)/100;a80=total()>=state.limit*.8;a100=total()>=state.limit;render();if(a100)notify('Suas compras já atingiram ou passaram do limite de '+money(state.limit)+'.')};
$('add').onclick=()=>{let price=Number($('price').value);if(!Number.isFinite(price)||price<=0)return alert('Digite um preço maior que zero.');let before=total();state.items.push({name:$('name').value.trim(),price:Math.round(price*100)/100});$('name').value='';$('price').value='';let after=total();if(state.limit&&!a80&&before<state.limit*.8&&after>=state.limit*.8){a80=true;render();notify('Atenção: você chegou a 80% do seu limite ('+money(state.limit)+').')}else if(state.limit&&!a100&&before<state.limit&&after>=state.limit){a100=true;render();notify('Você atingiu ou ultrapassou seu limite de '+money(state.limit)+'!')}else render()};
$('price').onkeydown=e=>{if(e.key==='Enter')$('add').click()};$('reset').onclick=()=>{if(confirm('Quer apagar todos os produtos e zerar as compras?')){state.items=[];a80=a100=false;render()}};render();
</script></body></html>
